[package]
name = "gotel"
version = "0.13.0"
edition = "2021"
rust-version = "1.88"
description = "Gotel conventions and safe SQL telemetry for OpenTelemetry Rust applications"
license = "MIT"
repository = "https://github.com/zfogg/gotel"
readme = "README.md"

[features]
default = ["otlp"]
otlp = ["dep:opentelemetry-otlp", "dep:reqwest"]

[dependencies]
sequel = { git = "https://github.com/zfogg/sequel", tag = "v0.2.0", version = "0.2.0" }
opentelemetry = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"], optional = true }
serde_json = "1"
url = "2"
reqwest = { version = "0.13.1", default-features = false, features = ["blocking", "rustls"], optional = true }

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", features = ["testing"] }
futures = "0.3"
opentelemetry-proto = { version = "0.33.1", features = ["gen-tonic-messages"] }
prost = "0.14"
