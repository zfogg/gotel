name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  c-gotel:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sqlite: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libsqlite3-dev libssl-dev python3
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3 sqlite
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install openssl:x64-windows sqlite3:x64-windows
      - name: Configure C adapter with sanitizers
        if: runner.os == 'Linux'
        run: >-
          cmake -S c-gotel -B c-gotel/build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_EXTENSIONS=OFF
          -DCGOTEL_BUILD_TESTS=ON -DCGOTEL_WITH_SQLITE=${{ matrix.sqlite }}
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Configure macOS C adapter
        if: runner.os == 'macOS'
        run: >-
          cmake -S c-gotel -B c-gotel/build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_EXTENSIONS=OFF
          -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
          -DCGOTEL_BUILD_TESTS=ON -DCGOTEL_WITH_SQLITE=${{ matrix.sqlite }}
          -DBUILD_SHARED_LIBS=ON
      - name: Configure Windows C adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          cmake -S c-gotel -B c-gotel/build -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_C_EXTENSIONS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCGOTEL_BUILD_TESTS=ON -DCGOTEL_WITH_SQLITE=${{ matrix.sqlite }} `
            -DBUILD_SHARED_LIBS=ON
      - run: cmake --build c-gotel/build --parallel 4
      - name: Test C adapter
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export PATH="$PWD/c-gotel/vcpkg_installed/x64-windows/debug/bin:$PWD/c-gotel/vcpkg_installed/x64-windows/bin:$PATH"
          fi
          ctest --test-dir c-gotel/build --output-on-failure

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  fuzz-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./sqltrace -run '^$' -fuzz FuzzSanitizeDoesNotRetainQuotedPayload -fuzztime 10s
