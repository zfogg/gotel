name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  c-gotel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sqlite: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libsqlite3-dev libssl-dev python3
      - name: Configure C adapter with sanitizers
        run: >-
          cmake -S c-gotel -B c-gotel/build -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_EXTENSIONS=OFF
          -DCGOTEL_BUILD_TESTS=ON -DCGOTEL_WITH_SQLITE=${{ matrix.sqlite }}
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build c-gotel/build --parallel 4
      - run: ctest --test-dir c-gotel/build --output-on-failure

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  fuzz-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./sqltrace -run '^$' -fuzz FuzzSanitizeDoesNotRetainQuotedPayload -fuzztime 10s
