name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - codex/release-preflight
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate without publishing
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate tag and package versions
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ '${{ github.event_name }}' == push && '${{ github.ref_type }}' == branch ]]; then
            tag="v$(node -p 'require("./package.json").version')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          version="${tag#v}"
          grep -Fq "project(c-gotel VERSION $version LANGUAGES C)" c-gotel/CMakeLists.txt
          node -e 'if (require("./package.json").version !== process.argv[1]) process.exit(1)' "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  c-libraries:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-26-intel, os: macos, arch: x64 }
          - { runner: macos-26, os: macos, arch: arm64 }
          - { runner: windows-2025, os: windows, arch: x64, triplet: x64-windows, msvc_arch: amd64 }
          - { runner: windows-11-arm, os: windows, arch: arm64, triplet: arm64-windows, msvc_arch: amd64_arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libsqlite3-dev libssl-dev python3
      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: brew install llvm ninja openssl@3 sqlite
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install Windows native dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: |
          vcpkg install "openssl:$env:VCPKG_TRIPLET" "sqlite3:$env:VCPKG_TRIPLET" "pcre2:$env:VCPKG_TRIPLET" "utf8proc:$env:VCPKG_TRIPLET"
      - name: Build, test, and package static and shared libraries on Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          osx_args=()
          if [[ '${{ matrix.os }}' == macos ]]; then
            export PATH="$(brew --prefix llvm)/bin:$PATH"
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
            osx_args=(-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0)
          fi
          for linkage in static shared; do
            shared=OFF
            if [[ "$linkage" == shared ]]; then shared=ON; fi
            cmake -S c-gotel -B "c-gotel/build-$linkage" -G Ninja \
              -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_EXTENSIONS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DBUILD_SHARED_LIBS="$shared" \
              -DCGOTEL_BUILD_TESTS=ON -DCGOTEL_WITH_SQLITE=ON "${osx_args[@]}"
            cmake --build "c-gotel/build-$linkage" --parallel 4
            ctest --test-dir "c-gotel/build-$linkage" --output-on-failure --parallel 4
            python scripts/package_release.py c \
              --tag '${{ needs.validate.outputs.tag }}' \
              --build "c-gotel/build-$linkage" \
              --otlp-source "c-gotel/build-$linkage/_deps/otlp_c-src" \
              --expected-arch '${{ matrix.arch }}' \
              --linkage "$linkage" --output release-assets
          done
      - name: Build, test, and package static and shared libraries on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: |
          foreach ($linkage in @('static', 'shared')) {
            $shared = if ($linkage -eq 'shared') { 'ON' } else { 'OFF' }
            $build = "c-gotel/build-$linkage"
            cmake -S c-gotel -B $build -G Ninja `
              -DCMAKE_C_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
              -DBUILD_SHARED_LIBS=$shared -DCGOTEL_BUILD_TESTS=ON -DCGOTEL_WITH_SQLITE=ON
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $build --parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ctest --test-dir $build --output-on-failure --parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python scripts/package_release.py c `
              --tag '${{ needs.validate.outputs.tag }}' `
              --build $build `
              --otlp-source "$build/_deps/otlp_c-src" `
              --expected-arch '${{ matrix.arch }}' `
              --linkage $linkage --output release-assets
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-c-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/*.zip
          if-no-files-found: error

  typescript:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package compiled TypeScript as one ZIP
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          mkdir -p release-assets package-tmp
          npm pack --pack-destination package-tmp
          python scripts/package_release.py typescript \
            --tag "$RELEASE_TAG" \
            --tarball "package-tmp/zfogg-gotel-${RELEASE_TAG#v}.tgz" \
            --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-typescript
          path: release-assets/*.zip
          if-no-files-found: error

  go-source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  publish:
    needs: [validate, c-libraries, typescript, go-source]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES.md"
          fi
          gh release upload "$RELEASE_TAG" *.zip SHA256SUMS --clobber
