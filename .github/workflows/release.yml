name: Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - codex/release-preflight
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate without publishing
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/codex/release-preflight' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate tag and package versions
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if [[ '${{ github.event_name }}' == push && '${{ github.ref_type }}' == branch ]]; then
            tag="v$(node -p 'require("./package.json").version')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag"; exit 1; }
          version="${tag#v}"
          grep -Fq "project(gotel VERSION $version LANGUAGES C)" c/CMakeLists.txt
          node -e 'if (require("./package.json").version !== process.argv[1]) process.exit(1)' "$version"
          python -c 'import sys,tomllib; assert tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"] == sys.argv[1]' "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  c-libraries:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-26-intel, os: macos, arch: x64 }
          - { runner: macos-26, os: macos, arch: arm64 }
          - { runner: windows-2025, os: windows, arch: x64, triplet: x64-windows, msvc_arch: amd64 }
          - { runner: windows-11-arm, os: windows, arch: arm64, triplet: arm64-windows, msvc_arch: amd64_arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # x64 Python can launch native ARM64 test executables on Windows ARM.
          architecture: ${{ matrix.os == 'windows' && 'x64' || matrix.arch }}
      - name: Install gRPC test peers
        run: python -m pip install -r c/tests/requirements-grpc.txt
      - name: Install independent SQL formatting test engines
        run: python -m pip install -r c/tests/requirements-format.txt
      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libsqlite3-dev libssl-dev python3
      - name: Install macOS dependencies
        if: matrix.os == 'macos'
        run: brew install ninja openssl@3 sqlite
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install Windows native dependencies
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: |
          vcpkg install "openssl:$env:VCPKG_TRIPLET" "sqlite3:$env:VCPKG_TRIPLET" "pcre2:$env:VCPKG_TRIPLET" "utf8proc:$env:VCPKG_TRIPLET"
      - name: Build, test, and package static and shared libraries on Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          osx_args=()
          compiler=clang
          if [[ '${{ matrix.os }}' == macos ]]; then
            compiler="$(xcrun --find clang)"
            export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
            osx_args=(-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0)
          fi
          for linkage in static shared; do
            shared=OFF
            if [[ "$linkage" == shared ]]; then shared=ON; fi
            cmake -S c -B "c/build-$linkage" -G Ninja \
              -DCMAKE_C_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
              -DPython3_EXECUTABLE="$(command -v python)" \
              -DCMAKE_C_EXTENSIONS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DBUILD_SHARED_LIBS="$shared" \
              -DGOTEL_BUILD_TESTS=ON -DGOTEL_WITH_SQLITE=ON -DGOTEL_WITH_GRPC=ON "${osx_args[@]}"
            cmake --build "c/build-$linkage" --parallel 4
            ctest --test-dir "c/build-$linkage" --output-on-failure --parallel 4
            python scripts/package_release.py c \
              --tag '${{ needs.validate.outputs.tag }}' \
              --build "c/build-$linkage" \
              --otlp-source "c/build-$linkage/_deps/otlp_c-src" \
              --nghttp2-source "c/build-$linkage/_deps/gotel_nghttp2-src" \
              --expected-arch '${{ matrix.arch }}' \
              --linkage "$linkage" --output release-assets
          done
      - name: Build, test, and package static and shared libraries on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: |
          foreach ($linkage in @('static', 'shared')) {
            $shared = if ($linkage -eq 'shared') { 'ON' } else { 'OFF' }
            $build = "c/build-$linkage"
            cmake -S c -B $build -G Ninja `
              -DCMAKE_C_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release `
              -DPython3_EXECUTABLE="$((Get-Command python).Source)" `
              -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
              -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET" `
              -DBUILD_SHARED_LIBS=$shared -DGOTEL_BUILD_TESTS=ON -DGOTEL_WITH_SQLITE=ON -DGOTEL_WITH_GRPC=ON
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            cmake --build $build --parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            ctest --test-dir $build --output-on-failure --parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python scripts/package_release.py c `
              --tag '${{ needs.validate.outputs.tag }}' `
              --build $build `
              --otlp-source "$build/_deps/otlp_c-src" `
              --nghttp2-source "$build/_deps/gotel_nghttp2-src" `
              --expected-arch '${{ matrix.arch }}' `
              --linkage $linkage --output release-assets
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-c-${{ matrix.os }}-${{ matrix.arch }}
          path: release-assets/*.zip
          if-no-files-found: error

  typescript:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@10.20.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Package compiled TypeScript as one ZIP
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          mkdir -p release-assets package-tmp
          npm pack --pack-destination package-tmp
          python scripts/package_release.py typescript \
            --tag "$RELEASE_TAG" \
            --tarball "package-tmp/zfogg-gotel-${RELEASE_TAG#v}.tgz" \
            --output release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-typescript
          path: release-assets/*.zip
          if-no-files-found: error

  go-source:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: python scripts/sync_sql_engine.py --check
      - working-directory: go
        run: go test ./...

  python:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          python-version: '3.12'
      - run: python scripts/sync_sql_engine.py --check
      - working-directory: python
        run: uv sync --all-extras --locked
      - working-directory: python
        run: uv run --all-extras pytest -q
      - working-directory: python
        run: uv run --all-extras ruff format --check src tests setup.py
      - working-directory: python
        run: uv run --all-extras ty check
      - working-directory: python
        run: uv build --sdist
      - uses: pypa/cibuildwheel@v4.3.1
        with:
          package-dir: python
          output-dir: python/dist
        env:
          CIBW_BUILD: 'cp311-* cp312-* cp313-* cp314-*'
          CIBW_SKIP: '*-musllinux* *-win32 *-manylinux_i686'
          CIBW_ARCHS: native
          CIBW_TEST_COMMAND: >-
            python -c "from gotel.sqltrace import inspect,Dialect; assert inspect('SELECT 1',dialect=Dialect.CLICKHOUSE).operation == 'SELECT'"
      - run: python scripts/test_python_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-python-${{ matrix.os }}
          path: |
            python/dist/*.whl
            python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, c-libraries, typescript, go-source, python]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable nested Go module tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          tag="go/$RELEASE_TAG"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [[ -n "$remote_tag" ]]; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          else
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com tag -a "$tag" -m "Go module $RELEASE_TAG"
            git push origin "refs/tags/$tag"
          fi
      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          cd release-assets
          sha256sum *.zip *.whl *.tar.gz > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$GITHUB_WORKSPACE/.github/RELEASE_NOTES.md"
          fi
          gh release upload "$RELEASE_TAG" *.zip *.whl *.tar.gz SHA256SUMS --clobber
