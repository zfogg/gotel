services:
  spaniel:
    image: ghcr.io/zfogg/spaniel:latest
    command: ["--db-path", "/data/spaniel.duckdb", "--no-browser"]
    environment:
      SPANIEL_BIND_ADDRESS_V4: 0.0.0.0
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: examples/full-stack/Dockerfile.api
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://spaniel:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    depends_on:
      spaniel: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  browser:
    build:
      context: ../..
      dockerfile: examples/full-stack/Dockerfile.browser
    ports:
      - "127.0.0.1:18081:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20

  runner:
    build:
      context: ../..
      dockerfile: examples/full-stack/Dockerfile.runner
    depends_on:
      browser: { condition: service_healthy }

  verify:
    image: python:3.12-alpine
    volumes:
      - ./verify.py:/verify.py:ro
    command: ["python", "/verify.py"]
    depends_on:
      runner: { condition: service_completed_successfully }
